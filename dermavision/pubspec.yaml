name: dermavision
description: "AI-powered skin disease detection application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.5

  # UI
  google_fonts: ^6.3.1
  flutter_svg: ^2.2.1
  lottie: ^3.3.2
  flutter_animate: ^4.5.2

  # Camera & Images
  camera: ^0.11.2
  image_picker: ^1.2.0
  image: ^4.8.0
  permission_handler: ^12.0.1

  # Networking
  dio: ^5.9.0

  # On-device ML inference (skin/non-skin TFLite model)
  tflite_flutter: ^0.12.1

  # Local Storage
  shared_preferences: ^2.5.3

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  firebase_storage: ^12.3.3

  # Maps & Location
  google_maps_flutter: ^2.12.3
  geolocator: ^14.0.2
  url_launcher: ^6.3.2

  # PDF Report
  pdf: ^3.11.3
  printing: ^5.14.2
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/illustrations/
    - assets/models/